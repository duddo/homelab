services:
  pigeonpod:
    image: ghcr.io/aizhimou/pigeon-pod:latest
    restart: unless-stopped
    expose:
      - 8080
    volumes:
      - /root/volumes/pigeonpod:/data
    environment:
      - TZ=Europe/Rome
      - PIGEON_BASE_URL=https://pigeonpod.totaro.net
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/data/pigeon-pod.db
    depends_on:
      - cloudflare-tunnel
    networks:
      - cloudflare-pigeonpod

  cloudflare-tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - "TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}"
    networks:
      - cloudflare-pigeonpod

networks:
  cloudflare-pigeonpod: